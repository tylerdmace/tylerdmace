<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1150" width="900" height="1150" role="img" aria-label="Tyler Mace – profile" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Tyler Mace</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#121a38"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="0.5" stop-color="#3b3f9e"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="heroR" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="0.5" stop-color="#3b3f9e"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="typeclip">
      <rect x="60" y="188" width="0" height="34">
        <animate attributeName="width" from="0" to="320" dur="2.2s" begin="1.1s" fill="freeze"/>
      </rect>
    </clipPath>
  </defs>

  <style>
    text{font-family:"Segoe UI",-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif}
    .mono{font-family:"SFMono-Regular",Consolas,"Liberation Mono","Courier New",monospace}
    .r{opacity:0;animation:rise .9s cubic-bezier(.2,.7,.2,1) forwards}
    @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
    .tw{animation:tw 3.2s ease-in-out infinite}
    @keyframes tw{0%,100%{opacity:.15}50%{opacity:.9}}
    .blink{animation:blink 1s steps(2,start) infinite}
    @keyframes blink{to{visibility:hidden}}
    .draw{stroke-dasharray:150;stroke-dashoffset:150;animation:draw 1.6s ease-out 3.4s forwards}
    @keyframes draw{to{stroke-dashoffset:0}}
    .pop{opacity:0;animation:pop .5s ease-out forwards}
    @keyframes pop{from{opacity:0}to{opacity:1}}
    .lab{font-size:13px;font-weight:700;letter-spacing:3px;fill:#818cf8}
    .body{font-size:16px;fill:#cbd5e1}
    .key{font-size:13px;font-weight:600;letter-spacing:1.5px;fill:#94a3b8}
    .val{font-size:16px;fill:#e2e8f0}
    .h{font-size:17px;font-weight:600;fill:#fff}
    .sub{font-size:14px;fill:#94a3b8}
    @media (prefers-reduced-motion:reduce){
      .r,.pop{opacity:1;animation:none}
      .tw,.blink{animation:none}
      .draw{animation:none;stroke-dashoffset:0}
    }
  </style>

  <!-- Page -->
  <rect width="900" height="1150" fill="url(#bg)"/>

  <!-- Header waves -->
  <g>
    <path fill="url(#hero)" opacity="0.35" d="M0 0H1800V225Q1687 195 1575 225T1350 225T1125 225T900 225T675 225T450 225T225 225T0 225Z">
      <animateTransform attributeName="transform" type="translate" from="-900 0" to="0 0" dur="14s" repeatCount="indefinite"/>
    </path>
    <path fill="url(#heroR)" opacity="0.55" d="M0 0H1800V205Q1687 235 1575 205T1350 205T1125 205T900 205T675 205T450 205T225 205T0 205Z">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-900 0" dur="10s" repeatCount="indefinite"/>
    </path>
    <path fill="url(#hero)" opacity="0.9" d="M0 0H1800V170Q1687 140 1575 170T1350 170T1125 170T900 170T675 170T450 170T225 170T0 170Z">
      <animateTransform attributeName="transform" type="translate" from="-900 0" to="0 0" dur="18s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Twinkling stars -->
  <g fill="#fff">
    <circle class="tw" cx="760" cy="40" r="1.6" style="animation-delay:0s"/>
    <circle class="tw" cx="820" cy="90" r="1.2" style="animation-delay:.8s"/>
    <circle class="tw" cx="690" cy="110" r="1.4" style="animation-delay:1.6s"/>
    <circle class="tw" cx="860" cy="30" r="1.1" style="animation-delay:2.2s"/>
    <circle class="tw" cx="610" cy="45" r="1.3" style="animation-delay:.4s"/>
    <circle class="tw" cx="540" cy="95" r="1" style="animation-delay:1.2s"/>
    <circle class="tw" cx="300" cy="35" r="1.2" style="animation-delay:2.6s"/>
    <circle class="tw" cx="410" cy="120" r="1.1" style="animation-delay:1.9s"/>
    <circle class="tw" cx="850" cy="150" r="1.4" style="animation-delay:.2s"/>
  </g>

  <!-- Name & title -->
  <text class="r" x="60" y="95" font-size="58" font-weight="800" fill="#fff" style="animation-delay:.2s">Tyler Mace</text>
  <text class="r" x="62" y="132" font-size="18" fill="#e0e7ff" style="animation-delay:.5s">[Your Title]  ·  [City, Country]</text>

  <!-- Typing line -->
  <g clip-path="url(#typeclip)">
    <text class="mono" x="60" y="212" font-size="18" fill="#c7d2fe" textLength="320" lengthAdjust="spacingAndGlyphs">[One line about what you do]</text>
  </g>
  <rect class="blink" x="60" y="195" width="2" height="22" fill="#fff">
    <animate attributeName="x" from="60" to="380" dur="2.2s" begin="1.1s" fill="freeze"/>
  </rect>

  <!-- ABOUT -->
  <g class="r" style="animation-delay:3.0s">
    <text class="lab" x="60" y="300">ABOUT</text>
    <text class="body" x="60" y="332">I'm a [role] based in [city]. Currently at [Company], where I [one-line impact statement].</text>
    <text class="body" x="60" y="358">Outside of work, you'll find me [hobby], [hobby], or [hobby].</text>
  </g>

  <rect x="60" y="388" width="780" height="1.5" fill="url(#rule)" class="pop" style="animation-delay:3.2s"/>

  <!-- RIGHT NOW -->
  <g class="r" style="animation-delay:3.4s">
    <text class="lab" x="60" y="428">RIGHT NOW</text>
    <text class="key" x="60" y="464">FOCUSED ON</text>
    <text class="val" x="230" y="464">[Current project or goal]</text>
    <text class="key" x="60" y="496">LEARNING</text>
    <text class="val" x="230" y="496">[Something you're picking up]</text>
    <text class="key" x="60" y="528">OPEN TO</text>
    <text class="val" x="230" y="528">[Roles, collaborations, conversations]</text>
  </g>

  <rect x="60" y="558" width="780" height="1.5" fill="url(#rule)" class="pop" style="animation-delay:3.6s"/>

  <!-- SELECTED WORK -->
  <g class="r" style="animation-delay:3.8s">
    <text class="lab" x="60" y="598">SELECTED WORK</text>

    <circle cx="68" cy="630" r="4" fill="#818cf8"/>
    <text class="h" x="86" y="636">[Project One]</text>
    <text class="sub" x="86" y="660">One sentence on what it is and why it matters.</text>

    <circle cx="68" cy="696" r="4" fill="#818cf8"/>
    <text class="h" x="86" y="702">[Project Two]</text>
    <text class="sub" x="86" y="726">One sentence, ideally with a result.</text>

    <circle cx="68" cy="762" r="4" fill="#818cf8"/>
    <text class="h" x="86" y="768">[Project Three]</text>
    <text class="sub" x="86" y="792">One sentence on the problem it solves.</text>
  </g>

  <rect x="60" y="822" width="780" height="1.5" fill="url(#rule)" class="pop" style="animation-delay:4.0s"/>

  <!-- BACKGROUND -->
  <g class="r" style="animation-delay:4.2s">
    <text class="lab" x="60" y="862">BACKGROUND</text>
  </g>
  <line class="draw" x1="68" y1="890" x2="68" y2="1030" stroke="#6366f1" stroke-width="2"/>

  <g class="r" style="animation-delay:4.5s">
    <circle cx="68" cy="894" r="6" fill="#0b1020" stroke="#818cf8" stroke-width="2"/>
    <text class="key" x="96" y="899">2023 – NOW</text>
    <text class="h" x="230" y="899">[Company] · [Title]</text>
    <text class="sub" x="230" y="921">[One-line achievement]</text>
  </g>
  <g class="r" style="animation-delay:4.8s">
    <circle cx="68" cy="954" r="6" fill="#0b1020" stroke="#818cf8" stroke-width="2"/>
    <text class="key" x="96" y="959">2020 – 2023</text>
    <text class="h" x="230" y="959">[Company] · [Title]</text>
    <text class="sub" x="230" y="981">[One-line achievement]</text>
  </g>
  <g class="r" style="animation-delay:5.1s">
    <circle cx="68" cy="1014" r="6" fill="#0b1020" stroke="#818cf8" stroke-width="2"/>
    <text class="key" x="96" y="1019">2016 – 2020</text>
    <text class="h" x="230" y="1019">[University] · [Degree]</text>
    <text class="sub" x="230" y="1041">[Focus or honors]</text>
  </g>

  <!-- CV pointer -->
  <text class="mono r" x="60" y="1078" font-size="14" fill="#818cf8" style="animation-delay:5.4s">Full CV  →  CV.md</text>

  <!-- Footer waves -->
  <g>
    <path fill="url(#heroR)" opacity="0.4" d="M0 1150H1800V1100Q1687 1080 1575 1100T1350 1100T1125 1100T900 1100T675 1100T450 1100T225 1100T0 1100Z">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-900 0" dur="12s" repeatCount="indefinite"/>
    </path>
    <path fill="url(#hero)" opacity="0.85" d="M0 1150H1800V1122Q1687 1102 1575 1122T1350 1122T1125 1122T900 1122T675 1122T450 1122T225 1122T0 1122Z">
      <animateTransform attributeName="transform" type="translate" from="-900 0" to="0 0" dur="16s" repeatCount="indefinite"/>
    </path>
  </g>
</svg>
